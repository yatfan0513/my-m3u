<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>全能視頻播放器</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  <style>
    :root {
      --bg: #000;
      --text: #f5f7fa;
      --muted: rgba(245, 247, 250, 0.74);
      --border: rgba(255, 255, 255, 0.18);
      --surface: rgba(255, 255, 255, 0.08);
      --surface-2: rgba(255, 255, 255, 0.12);
      --surface-3: rgba(255, 255, 255, 0.18);
      --button: rgba(255, 255, 255, 0.14);
      --button-hover: rgba(255, 255, 255, 0.22);
      --accent: #67d0ff;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
      --zoom: 1;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", "Source Han Sans HK", sans-serif;
    }
    button, input { font: inherit; }

    .app {
      min-height: 100vh;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    .shell {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 2.6vw, 2rem);
      line-height: 1.1;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.88rem;
      white-space: nowrap;
    }

    .hint, .status, .small-note { color: var(--muted); line-height: 1.5; }
    .hint { font-size: 0.95rem; }
    .status { min-height: 1.4em; font-size: 0.95rem; }

    .row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .input-row { gap: 12px; }

    .url-input, .mini-input {
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.18);
      color: var(--text);
      outline: none;
    }

    .url-input::placeholder, .mini-input::placeholder { color: rgba(245, 247, 250, 0.46); }

    .url-input {
      flex: 1 1 620px;
      min-width: min(100%, 260px);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .mini-input {
      width: 92px;
      border-radius: 14px;
      padding: 11px 12px;
      text-align: center;
    }

    .mini-input.wide { width: 128px; }

    .button {
      border: 1px solid var(--border);
      background: var(--button);
      color: var(--text);
      border-radius: 14px;
      padding: 11px 15px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
      white-space: nowrap;
    }

    .button:hover { background: var(--button-hover); }
    .button:active { transform: translateY(1px); }
    .button.primary {
      background: linear-gradient(135deg, rgba(103, 208, 255, 0.24), rgba(103, 208, 255, 0.12));
      border-color: rgba(103, 208, 255, 0.4);
    }
    .button:disabled { opacity: 0.45; cursor: not-allowed; }

    .bg-row .button { min-width: 96px; }

    .stage {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      width: 100%;
    }

    .media-wrap {
      flex: 0 0 auto;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      min-height: 0;
      max-width: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.24);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-inline: auto;
      align-self: center;
    }

    .media-wrap video,
    .media-wrap audio,
    .media-wrap img {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      z-index: 1;
      margin: auto;
    }

    .media-wrap video,
    .media-wrap audio {
      background: #000;
      object-fit: contain;
      -webkit-object-fit: contain;
    }

    .media-wrap video {
      -webkit-transform: scale(var(--zoom));
      transform: scale(var(--zoom));
      -webkit-transform-origin: center center;
      transform-origin: center center;
      will-change: transform;
    }
    .media-wrap img {
      object-fit: contain;
      -webkit-object-fit: contain;
      background: #000;
      -webkit-transform: scale(var(--zoom));
      transform: scale(var(--zoom));
      -webkit-transform-origin: center center;
      transform-origin: center center;
    }

    .progress-wrap { display: grid; gap: 10px; }
    .progress {
      width: 100%;
      height: 14px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls-block { display: grid; gap: 12px; }
    .control-group {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .label { color: var(--muted); font-size: 0.92rem; white-space: nowrap; }
    .mode-pill[data-mode="image"] { background: rgba(255,255,255,0.2); }

    .playlist {
      display: none;
      gap: 10px;
    }
    .playlist-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .playlist-list {
      display: grid;
      gap: 8px;
      max-height: 280px;
      overflow: auto;
      padding-right: 4px;
    }
    .playlist-item {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      cursor: pointer;
      text-align: left;
      display: grid;
      gap: 6px;
    }
    .playlist-item:hover { background: var(--surface-3); }
    .playlist-item.active { border-color: rgba(103, 208, 255, 0.6); }
    .playlist-name { font-weight: 600; }
    .playlist-url {
      color: var(--muted);
      font-size: 0.86rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .playlist-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .probe-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.76rem;
      line-height: 1.2;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }
    .probe-badge.pending { opacity: 0.8; }
    .probe-badge.ok { border-color: rgba(55, 196, 110, 0.45); background: rgba(55, 196, 110, 0.14); }
    .probe-badge.fail { border-color: rgba(255, 86, 86, 0.45); background: rgba(255, 86, 86, 0.14); }
    .probe-badge.live { border-color: rgba(103, 208, 255, 0.45); background: rgba(103, 208, 255, 0.14); }

    .is-image .progress-wrap,
    .is-image .playback-group,
    .is-image .speed-group,
    .is-image .seek-group,
    .is-image .speed-row {
      display: none !important;
    }

    .sniff-progress {
      display: none;
      padding: 10px;
      background: rgba(255, 152, 0, 0.12);
      border: 1px solid rgba(255, 152, 0, 0.3);
      border-radius: 12px;
      font-size: 0.9rem;
      color: #ffb74d;
    }
    .sniff-progress .progress-bar-outer {
      width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 6px;
    }
    .sniff-progress .progress-bar-inner {
      height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s;
      width: 0%;
    }

    .filter-btn {
      font-size: 0.82rem !important;
      padding: 8px 12px !important;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, rgba(233, 30, 99, 0.3), rgba(233, 30, 99, 0.15));
      border-color: rgba(233, 30, 99, 0.5);
    }

    @media (max-width: 720px) {
      .app { padding: 8px; }
      .card { border-radius: 16px; padding: 10px; }
      .button { padding: 10px 12px; }
      .bg-row .button { min-width: calc(50% - 10px); }
      .url-input { flex-basis: 100%; }
      .mini-input, .mini-input.wide { width: 100%; max-width: 130px; }
      .media-wrap { width: 100%; min-height: 0; height: auto; }
    }
  </style>
</head>
<body>
  <div class="app" id="appRoot">
    <div class="shell">
      <div class="card">
        <div class="title-row">
          <h1>🎬 全能視頻播放器</h1>
          <span class="pill mode-pill" id="modePill" data-mode="idle">待載入</span>
        </div>
        <div class="hint" style="margin-top: 8px">
          支援 M3U8、M3U、HTTP/HTTPS、影片、音頻、圖片。HLS 用 HLS.js 引擎播放。可嗅探網頁入面嘅視頻資源。RTSP／RTMP 需要先轉做 HLS 格式。
        </div>
      </div>

      <div class="card">
        <div class="row input-row">
          <input id="sourceInput" class="url-input" type="text" placeholder="請輸入視頻網址／M3U 清單／網頁網址（可以嗅探視頻）" autocomplete="off" spellcheck="false" />
          <button id="loadBtn" class="button primary">▶ 播放</button>
          <button id="parseBtn" class="button">📋 解析清單</button>
          <button id="sniffBtn" class="button">🔍 嗅探網頁</button>
          <button id="refreshBtn" class="button">🔄 刷新</button>
          <button id="clearBtn" class="button">清空</button>
        </div>
        <div id="status" class="status" style="margin-top: 10px">未載入任何內容。</div>
        <div id="sniffProgress" class="sniff-progress" style="margin-top: 10px"></div>
      </div>

      <div class="card bg-row">
        <div class="row">
          <button class="button" data-bg="#000000" data-fg="#f5f7fa">純黑</button>
          <button class="button" data-bg="#ffffff" data-fg="#111111">純白</button>
          <button class="button" data-bg="#808080" data-fg="#ffffff">純灰</button>
          <button class="button" data-bg="#0b1f3a" data-fg="#f5f7fa">深藍</button>
          <button class="button" data-bg="#d11f1f" data-fg="#ffffff">純紅</button>
          <button class="button" data-bg="#168a2f" data-fg="#ffffff">純綠</button>
          <button class="button" data-bg="#efe0b2" data-fg="#2a2417">米黃</button>
          <button class="button" data-bg="#1e67ff" data-fg="#ffffff">純藍</button>
          <button class="button" data-bg="#1f1e33" data-fg="#f5f7fa">藏紫</button>
        </div>
      </div>

      <div class="stage" id="stageRoot">
        <div class="media-wrap">
          <video id="videoPlayer" playsinline webkit-playsinline preload="auto"></video>
          <audio id="audioPlayer" controls preload="metadata"></audio>
          <img id="imagePlayer" alt="圖片預覽" />
        </div>

        <div class="card progress-wrap" id="progressCard">
          <input id="progressBar" class="progress" type="range" min="0" max="1000" value="0" step="1" />
          <div class="time-row">
            <span id="currentTime">00:00:00</span>
            <span id="durationTime">00:00:00</span>
            <span id="zoomState">縮放：100%</span>
          </div>
        </div>

        <div class="card controls-block">
          <div class="control-group playback-group">
            <button id="toggleBtn" class="button primary">暫停</button>
            <span class="label">播放引擎</span>
            <span class="pill" id="enginePill">待命</span>
          </div>

          <div class="control-group seek-group">
            <span class="label">跳轉到</span>
            <input id="jumpHours" class="mini-input" type="number" min="0" step="1" placeholder="小時" />
            <input id="jumpMinutes" class="mini-input" type="number" min="0" step="1" placeholder="分鐘" />
            <input id="jumpSeconds" class="mini-input" type="number" min="0" step="1" placeholder="秒" />
            <button id="jumpBtn" class="button">跳轉</button>
            <span class="label">縮放比例</span>
            <input id="zoomInput" class="mini-input wide" type="number" min="0" max="100" step="any" placeholder="100" />
            <button id="zoomBtn" class="button">套用</button>
          </div>

          <div class="control-group speed-row">
            <span class="label">⏩ 快進</span>
            <div class="row">
              <button class="button" data-skip="5">+5s</button>
              <button class="button" data-skip="10">+10s</button>
              <button class="button" data-skip="15">+15s</button>
              <button class="button" data-skip="20">+20s</button>
              <button class="button" data-skip="30">+30s</button>
              <button class="button" data-skip="60">+1min</button>
              <button class="button" data-skip="120">+2min</button>
              <button class="button" data-skip="300">+5min</button>
            </div>
          </div>

          <div class="control-group speed-row">
            <span class="label">⏪ 倒退</span>
            <div class="row">
              <button class="button" data-skip="-5">-5s</button>
              <button class="button" data-skip="-10">-10s</button>
              <button class="button" data-skip="-15">-15s</button>
              <button class="button" data-skip="-20">-20s</button>
              <button class="button" data-skip="-30">-30s</button>
              <button class="button" data-skip="-60">-1min</button>
              <button class="button" data-skip="-120">-2min</button>
              <button class="button" data-skip="-300">-5min</button>
            </div>
          </div>

          <div class="control-group speed-group">
            <span class="label">⚡ 倍速</span>
            <div class="row" id="speedButtons">
              <button class="button" data-speed="0.25">0.25x</button>
              <button class="button" data-speed="0.5">0.5x</button>
              <button class="button" data-speed="0.75">0.75x</button>
              <button class="button primary" data-speed="1">1.0x</button>
              <button class="button" data-speed="1.25">1.25x</button>
              <button class="button" data-speed="1.5">1.5x</button>
              <button class="button" data-speed="1.75">1.75x</button>
              <button class="button" data-speed="2">2.0x</button>
              <button class="button" data-speed="2.5">2.5x</button>
              <button class="button" data-speed="3">3.0x</button>
            </div>
            <span class="label" id="speedInfo">播放引擎：待命</span>
          </div>
        </div>

        <div class="card playlist" id="playlistCard">
          <div class="playlist-head">
            <div>
              <div style="font-weight: 700">播放清單</div>
              <div class="small-note" id="playlistSummary">未有清單。</div>
            </div>
            <div class="row" style="gap:6px">
              <button id="filterBtn" class="button filter-btn">只顯示有效</button>
              <button id="checkAllBtn" class="button filter-btn">🔍 重新檢查</button>
              <button id="hidePlaylistBtn" class="button">收起</button>
            </div>
          </div>
          <div id="playlistList" class="playlist-list"></div>
        </div>
      </div>
    </div>
  </div>
